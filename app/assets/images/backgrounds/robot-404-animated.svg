<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Animated robot background for a 404 page</title>
  <desc id="desc">A coral robot with a gently floating head, waving arm, rotating gears and pulsing sparks. The left side is clear for page content. Animation pauses for reduced motion.</desc>
  <style><![CDATA[
    .gear { transform-box: fill-box; transform-origin: center; animation: gear-spin 20s linear infinite; }
    .reverse { animation-direction: reverse; }
    .head-float { animation: head-float 3.6s ease-in-out infinite; }
    .head-tilt { transform-box: fill-box; transform-origin: 50% 60%; animation: head-tilt 3.6s ease-in-out infinite; }
    .right-arm { transform-box: fill-box; transform-origin: 45% 88%; animation: arm-wave 3.6s ease-in-out infinite; }
    .loose-arm { transform-box: fill-box; transform-origin: 96% 8%; animation: loose-swing 4.8s ease-in-out infinite; }
    .sparks { animation: spark-pulse 1.8s ease-in-out infinite; }
    .spark-streak { animation: spark-drift 2.4s ease-out infinite; }
    .spark-streak.second { animation-delay: -.9s; }
    .gauge-needle { transform-box: view-box; transform-origin: 1331px 609px; animation: gauge-wobble 2.8s ease-in-out infinite; }
    .indicator { animation: indicator-pulse 2s ease-in-out infinite; }
    @keyframes gear-spin { to { transform: rotate(360deg); } }
    @keyframes head-float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-11px); } }
    @keyframes head-tilt { 0%,100% { transform: rotate(0); } 50% { transform: rotate(3deg); } }
    @keyframes arm-wave { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(5deg); } }
    @keyframes loose-swing { 0%,100% { transform: rotate(0); } 50% { transform: rotate(3deg); } }
    @keyframes spark-pulse { 0%,100% { opacity: .74; } 50% { opacity: 1; } }
    @keyframes spark-drift { 0% { transform: translateY(3px); opacity: .25; } 40% { opacity: .8; } 100% { transform: translateY(-10px); opacity: .15; } }
    @keyframes gauge-wobble { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(9deg); } }
    @keyframes indicator-pulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  ]]></style>
  <defs>
    <g id="screw">
